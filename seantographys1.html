<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Sean Lao</title>
    <link rel="stylesheet" href="seantographysstyle1.css">
</head>

<body>

    <div class="site-wrapper">

        <aside class="sidebar">

            <!-- logo I use across the whole portfolio so everything stays consistent -->
            <div class="logo-top">
                <img src="logologo.png" alt="Logo" class="star-logo">
            </div>

            <!-- main navigation so I can jump between all my portfolio pages -->
            <nav class="nav-links">
                <a href="seanportfolio.html" class="nav-item">Home</a>
                <a href="abtme.html" class="nav-item">About</a>
                <a href="seantography.html" class="nav-item active">Photography</a>
                <a href="myart.html" class="nav-item">Art</a>
                <a href="business.html" class="nav-item">Business</a>
                <a href="scrapbook.html" class="nav-item">Scrapbooking</a>
            </nav>

        </aside>

        <main class="main-content">

            <div class="window-frame">

                <aside class="inner-sidebar">

                    <!-- the mac-style window dots just to match the aesthetic -->
                    <div class="traffic-lights">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>

                    <!-- this is basically my fake "Photos app" sidebar -->
                    <div class="sidebar-scroll">

                        <div class="sidebar-section">
                            <p class="inner-sidebar-item active">Library</p>
                            <p class="inner-sidebar-item">Collections</p>
                        </div>

                        <div class="sidebar-section">
                            <label class="sidebar-label">Devices</label>
                            <p class="inner-sidebar-item">iPhone</p>
                        </div>

                        <div class="sidebar-section">
                            <p class="inner-sidebar-item">Pinned</p>
                            <p class="inner-sidebar-item">Albums</p>
                            <p class="inner-sidebar-item">Sharing</p>
                            <p class="inner-sidebar-item">Media Types</p>
                            <p class="inner-sidebar-item">Utilities</p>
                        </div>

                    </div>

                </aside>

                <section class="gallery-view">

                    <header class="gallery-header">

                        <div class="header-left">
                            <h1>Import</h1>

                            <!-- small toggle just to make it feel like a real system UI -->
                            <div class="header-sub-row">
                                <input type="checkbox" checked>
                                <span>Open Photos</span>
                            </div>

                        </div>

                        <div class="header-right">

                            <!-- zoom slider is just here for UI realism -->
                            <div class="zoom-tool">
                                <span>-</span>
                                <div class="slider">
                                    <div class="slider-fill"></div>
                                    <div class="slider-knob"></div>
                                </div>
                                <span>+</span>
                            </div>

                            <button class="btn-macos primary">
                                Import All New Photos
                            </button>

                        </div>

                    </header>

                    <div class="photo-container">

                        <!-- this section is basically where I dump my newest work -->
                        <h2>New Photos</h2>

                        <!-- grid layout so everything feels like a proper gallery -->
                        <div class="photo-grid">

                            <div class="photo-box"><img src="seantographypics/photo1.png"></div>
                            <div class="photo-box"><img src="seantographypics/photo2.png"></div>
                            <div class="photo-box"><img src="seantographypics/photo3.gif"></div>
                            <div class="photo-box"><img src="seantographypics/photo4.gif"></div>
                            <div class="photo-box"><img src="seantographypics/photo5.png"></div>
                            <div class="photo-box"><img src="seantographypics/photo6.png"></div>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>

</body>
</html>
